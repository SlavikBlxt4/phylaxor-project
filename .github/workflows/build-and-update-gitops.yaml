name: Build & Update GitOps

on:
  push:
    branches: ["main"]
    paths:
      - "services/**"
      - ".github/workflows/build-and-update-gitops.yml"

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout app repo (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed microservices
      id: detect
      run: |
        set -euo pipefail
        BASE_SHA="${{ github.event.before }}"
        HEAD_SHA="${{ github.sha }}"

        # Fallback para commits iniciales
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          BASE_SHA="$(git rev-parse HEAD~1 || true)"
        fi

        CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'services/**' || true)
        SERVICES=$(printf '%s\n' "$CHANGED_FILES" | awk -F/ 'NF>=2 {print $2}' | sort -u | xargs)

        echo "SERVICES: ${SERVICES:-<none>}"
        echo "CHANGED_SERVICES=${SERVICES:-}" >> "$GITHUB_ENV"
        echo "CHANGED_SERVICES_CSV=$(echo "${SERVICES:-}" | tr ' ' ',' )" >> "$GITHUB_ENV"

    - name: Stop if nothing changed
      if: env.CHANGED_SERVICES == ''
      run: |
        echo "No changed services. Exiting."
        exit 0

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & push images
      run: |
        set -euo pipefail
        for service in $CHANGED_SERVICES; do
          IMAGE="ghcr.io/slavikblxt4/phylaxor-$service"
          # Tag único y estable por run
          VERSION="r${{ github.run_number }}-$(git rev-parse --short ${{ github.sha }})"
          echo "▶ Building $service -> $IMAGE:$VERSION"
          docker build -t "$IMAGE:$VERSION" "./services/$service"
          docker push "$IMAGE:$VERSION"
          # Guardamos par servicio/tag para usar luego
          echo "$service=$VERSION" >> image_tags.txt
        done
      shell: bash

    - name: Checkout GitOps repo
      uses: actions/checkout@v4
      with:
        repository: SlavikBlxt4/phylaxor-gitops
        token: ${{ secrets.GH_GITOPS_TOKEN }}
        path: gitops
        ref: main
        fetch-depth: 0

    - name: Install yq (v4)
      run: |
        curl -sL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o /usr/local/bin/yq
        chmod +x /usr/local/bin/yq

    - name: Update values.yaml (dynamic key)
      id: update
      env:
        VALUES_FILE: gitops/apps/phylaxor/values.yaml
      run: |
        set -euo pipefail
        echo "Will update $(pwd)/$VALUES_FILE"
        while IFS='=' read -r service VERSION; do
          [ -z "$service" ] && continue
          echo "▶ Updating $service to tag $VERSION"
          # CLAVE CORRECTA EN YQ v4:
          yq -i '.images[env(service)].tag = strenv(VERSION)' "$VALUES_FILE"
        done < image_tags.txt

        echo "========= DIFF in values.yaml ========="
        git -C gitops diff --color=always apps/phylaxor/values.yaml || true

        # Señalizamos si hay cambios reales
        if git -C gitops diff --quiet --exit-code apps/phylaxor/values.yaml; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Pull Request
      if: steps.update.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GH_GITOPS_TOKEN }}
        path: gitops
        commit-message: "chore(gitops): update image tags for: ${{ env.CHANGED_SERVICES_CSV }}"
        title: "[CI] Update images for: ${{ env.CHANGED_SERVICES_CSV }}"
        body: |
          PR automático.
          Servicios cambiados:
          **${{ env.CHANGED_SERVICES }}**
        branch: ci/update-images-${{ github.run_id }}
        base: main
        labels: |
          automated
          phylaxor
        delete-branch: true

