name: Build & Update GitOps

on:
  push:
    branches: ["main"]

jobs:
  detect-build-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
    - name: Checkout code (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine changed services
      id: changed
      run: |
        set -e
        BASE_SHA="${{ github.event.before }}"
        HEAD_SHA="${{ github.sha }}"
        echo "Base: $BASE_SHA"
        echo "Head: $HEAD_SHA"

        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          echo "No base SHA (primer push o base desconocida). Asumo todos los servicios."
          CHANGED=$(git ls-files 'services/*' | cut -d/ -f2 | sort -u)
        else
          # Garantiza que tenemos el commit base disponible
          git fetch --no-tags --prune --depth=50 origin $BASE_SHA || true
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'services/*' | cut -d/ -f2 | sort -u)
        fi

        echo "CHANGED_SERVICES=$CHANGED" >> $GITHUB_ENV
        echo "Changed services: $CHANGED"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set Git identity
      run: |
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions"

    - name: Clone GitOps repo
      if: env.CHANGED_SERVICES != ''
      env:
        GITOPS_TOKEN: ${{ secrets.GH_GITOPS_TOKEN }}
      run: |
        git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/SlavikBlxt4/phylaxor-gitops.git"

    - name: Build & Push images + Update values.yaml
      if: env.CHANGED_SERVICES != ''
      run: |
        set -e
        for service in $CHANGED_SERVICES; do
          IMAGE_NAME="ghcr.io/slavikblxt4/phylaxor-$service"
          VERSION=$(date +%Y.%m.%d-%H%M%S)

          echo "=== Building $service as $IMAGE_NAME:$VERSION ==="
          docker build -t $IMAGE_NAME:$VERSION "./services/$service"
          docker push $IMAGE_NAME:$VERSION

          echo "=== Updating tag in GitOps values.yaml for $service ==="
          cd phylaxor-gitops
          # Requiere comentario marcador: "# $service"
          sed -i "s|tag: \".*\" # $service|tag: \"$VERSION\" # $service|" apps/phylaxor/values.yaml
          cd -
        done

        # Exportamos la rama para reusarla en el paso del PR
        echo "BRANCH=auto/update-$(date +%s)" >> $GITHUB_ENV

    - name: Commit & Push update branch
      if: env.CHANGED_SERVICES != ''
      env:
        GITOPS_TOKEN: ${{ secrets.GH_GITOPS_TOKEN }}
      run: |
        set -e
        cd phylaxor-gitops
        git checkout -b "${BRANCH}"
        git add apps/phylaxor/values.yaml
        git commit -m "Auto update of images: ${CHANGED_SERVICES}"
        git push "https://x-access-token:${GITOPS_TOKEN}@github.com/SlavikBlxt4/phylaxor-gitops.git" "${BRANCH}"

    - name: Create Pull Request
      if: env.CHANGED_SERVICES != ''
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GH_GITOPS_TOKEN }}
        repository: SlavikBlxt4/phylaxor-gitops
        branch: ${{ env.BRANCH }}
        base: main
        title: "[CI] Update images for: ${{ env.CHANGED_SERVICES }}"
        body: |
          PR generado automáticamente.
          Cambios detectados en servicios:
          **${{ env.CHANGED_SERVICES }}**
