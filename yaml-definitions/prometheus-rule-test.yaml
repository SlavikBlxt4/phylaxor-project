apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: phylaxor-test-alert
  namespace: phylaxor
spec:
  groups:
  - name: phylaxor-test.rules
    rules:
    - alert: PhylaxorRealPipelineTest
      expr: max by (namespace, pod) (kube_pod_status_phase{namespace="__TARGET_NAMESPACE__",pod="__TARGET_POD__",phase="Running"} == 1)
      for: 15s
      labels:
        severity: info
        phylaxor_run_id: __RUN_ID__
      annotations:
        summary: "Phylaxor real pipeline test"
        description: "Resource-backed alert to validate OpenShift Alertmanager -> Phylaxor"
