apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: phylaxor-test-alert
  namespace: phylaxor
  labels:
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
  - name: phylaxor-test.rules
    rules:
    - alert: PhylaxorRealPipelineTest
      expr: vector(1)
      for: 15s
      labels:
        severity: info
        namespace: phylaxor
      annotations:
        summary: "Phylaxor real pipeline test"
        description: "Synthetic alert to validate OpenShift Alertmanager -> Phylaxor"
