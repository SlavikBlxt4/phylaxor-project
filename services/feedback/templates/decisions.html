<h2>Decisions</h2>
<table border="1">
<tr>
    <th>ID</th><th>Path</th><th>Rule</th><th>KB</th><th>Latency</th><th>At</th><th>Alert</th>
</tr>
{% for d in decisions %}
<tr>
    <td>{{ d[0] }}</td>
    <td>{{ d[1] }}</td>
    <td>{{ d[2] }}</td>
    <td>{{ d[3] }}</td>
    <td>{{ d[4] }}ms</td>
    <td>{{ d[5] }}</td>
    <td>{{ d[6] }}</td>
</tr>
{% endfor %}
</table>
