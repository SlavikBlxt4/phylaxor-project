<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phylaxor Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">Phylaxor Dashboard</h1>
            <nav class="site-nav">
                <a href="/dashboard/alerts" class="nav-link">Alerts</a>
                <a href="/dashboard/decisions" class="nav-link">Decisions</a>
                <a href="/dashboard/kb" class="nav-link">Knowledge Base</a>
                <a href="/dashboard/matchers" class="nav-link">KB Matchers</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Phylaxor • Security intelligence at a glance</p>
        </div>
    </footer>
</body>
</html>
